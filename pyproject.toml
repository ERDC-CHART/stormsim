[project]
name = "stormsim"
version = "0.1.19"
description = "A modular coastal storm simulation system for synthetic storm lifecycles and physical impact modeling."
readme = "README.md"
authors = [
    { name = "StormSim Developers" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "requests",
    "numpy",
    "pandas",
    "h5py",
    "scipy",
    "tqdm",
    "duckdb",
    "boto3",
    "s3fs>=2023.6.0",
    "python-dotenv",
    "pyarrow",
    "pydantic>=2.10.6",
    "matplotlib>=3.7.5",
    "rasterio",
    "geopandas",
]

[project.urls]
Homepage = "https://github.com/ERDC-CHART/stormsim"
Repository = "https://github.com/ERDC-CHART/stormsim"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stormsim*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.15.13",
    "tables>=3.8.0",
]
